name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.5.0); leave empty for HEAD"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          RAW_REF="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RAW_REF#v}"
          echo "VERSION: $FILE_VERSION | tag: $TAG_VERSION"
          if [ "${{ github.event_name }}" = "push" ] && [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=OVH_WEBUI
            org.opencontainers.image.description=OVH bare-metal & VPS sniping, monitoring, and lifecycle console
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    name: Build Embedded Single Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Build single-binary artifacts
        run: |
          set -euo pipefail
          rm -rf server/web
          cp -r web/dist server/web
          VER="$(tr -d '[:space:]' < VERSION)"
          mkdir -p release-dist
          cd server
          for spec in "windows amd64 ovh-webui-windows-amd64.exe" "linux amd64 ovh-webui-linux-amd64" "linux arm64 ovh-webui-linux-arm64"; do
            set -- $spec
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -tags ui -trimpath \
              -ldflags="-s -w -X github.com/ovh-webui/server/internal/handlers.Version=${VER}" \
              -o "../release-dist/$3" .
          done
          cd ../release-dist
          sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ovh-webui-binaries
          path: release-dist/
