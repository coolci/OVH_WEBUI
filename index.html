<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OVH 统御 | 服务器抢购与运维控制台</title>
    <meta name="description" content="OVH 统御 - 服务器抢购与运维控制台，库存监控、独服/VPS 控制、线上巡检" />
    <meta name="author" content="OVH 统御" />
    <meta name="theme-color" content="#080c14" />

    <meta property="og:title" content="OVH 统御 | 服务器抢购与运维控制台" />
    <meta property="og:description" content="OVH 服务器抢购与运维控制台" />
    <meta property="og:type" content="website" />

    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ovh-theme");
          if (raw !== "light" && raw !== "dark" && raw !== "system") {
            var legacy = localStorage.getItem("theme");
            if (legacy === "light" || legacy === "dark" || legacy === "system") {
              raw = legacy;
              localStorage.setItem("ovh-theme", legacy);
            } else {
              raw = "system";
            }
          }
          var isDark =
            raw === "dark" ||
            (raw !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#080c14" : "#f8fafc");
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
