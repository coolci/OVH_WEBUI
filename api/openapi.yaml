openapi: 3.1.0
info:
  title: OVH_WEBUI Enterprise API
  description: Enterprise refactored API for OVH_WEBUI based on PRD-OVH_WEBUI-v3
  version: 3.0.0
servers:
  - url: /api
    description: Current API prefix

paths:
  /health:
    get:
      summary: Health check endpoint
      operationId: GetHealth
      tags:
        - F11
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 3.0.0

  /accounts:
    get:
      summary: List all configured OVH accounts
      operationId: ListAccounts
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a new OVH account
      operationId: CreateAccount
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /accounts/{id}:
    get:
      summary: Get account by ID
      operationId: GetAccountByID
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update account by ID
      operationId: UpdateAccount
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete account by ID
      operationId: DeleteAccountByID
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted successfully

  /accounts/{id}/verify:
    post:
      summary: Explicitly verify account credentials with OVH API
      operationId: VerifyAccountCredentials
      tags:
        - F01
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialVerificationResult'

  /catalog:
    get:
      summary: Fetch raw or cached OVH Eco server catalog
      operationId: GetCatalog
      tags:
        - F02
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subsidiary
          in: query
          required: false
          schema:
            type: string
            example: "IE"
        - name: forceRefresh
          in: query
          required: false
          schema:
            type: boolean
            example: false
      responses:
        '200':
          description: Raw OVH catalog payload with server plans and options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServerPlan'
        '400':
          $ref: '#/components/responses/BadRequest'

  /availability/{planCode}:
    get:
      summary: Check stock and delivery times for a given server model
      operationId: GetAvailability
      tags:
        - F02
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
            example: "24ska01"
      responses:
        '200':
          description: Availability status across datacenters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatacenterAvailability'
    post:
      summary: Refresh stock check for a given server model
      operationId: CheckAvailability
      tags:
        - F02
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
            example: "24ska01"
      responses:
        '200':
          description: Updated availability status across datacenters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatacenterAvailability'

  /queue:
    get:
      summary: List all active sniping queue tasks
      operationId: GetQueue
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
    post:
      summary: Add a new server model to the sniping queue
      operationId: AddQueueItem
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddQueueItemRequest'
      responses:
        '200':
          description: Successfully enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  itemIds:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /queue/{id}:
    delete:
      summary: Remove an item from the sniping queue
      operationId: RemoveQueueItem
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          $ref: '#/components/responses/NotFound'

  /queue/{id}/interval:
    put:
      summary: Update retry interval for a queue item
      operationId: UpdateQueueInterval
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interval
              properties:
                interval:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  example: 30
      responses:
        '200':
          description: Interval updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /queue/{id}/status:
    put:
      summary: Update status (pause or resume) of a queue item
      operationId: UpdateQueueStatus
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [running, paused]
                  example: "paused"
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'

  /queue/clear:
    delete:
      summary: Clear all items from sniping queue
      operationId: ClearQueue
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Queue cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  removed:
                    type: integer

  /queue/quick-order:
    post:
      summary: Place high-frequency quick order for in-stock server
      operationId: QuickOrder
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickOrderRequest'
      responses:
        '200':
          description: Quick order enqueued or fulfilled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /queue/timings:
    get:
      summary: Get latency metrics and checkout step timings
      operationId: GetQueueTimings
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Latency statistics
          content:
            application/json:
              schema:
                type: object

  /purchase-history:
    get:
      summary: Retrieve server purchase history log
      operationId: GetPurchaseHistory
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Purchase history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseHistoryEntry'
    delete:
      summary: Clear purchase history log
      operationId: ClearPurchaseHistory
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: History cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /purchase-history/refresh-status:
    post:
      summary: Sync and refresh real billing order statuses from OVHcloud
      operationId: RefreshOrderStatuses
      tags:
        - F04
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Orders refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  refreshed:
                    type: integer

  /servers:
    get:
      summary: List dedicated server catalog with cached availability
      operationId: ListServers
      tags:
        - F03
      security:
        - ApiKeyAuth: []
      parameters:
        - name: account
          in: query
          required: false
          schema:
            type: string
        - name: showApiServers
          in: query
          required: false
          schema:
            type: boolean
        - name: forceRefresh
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Server plans list with cache metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: No catalog data available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'

  /servers/{planCode}/price:
    post:
      summary: Query dynamic real-time price for a dedicated server configuration
      operationId: GetServerPrice
      tags:
        - F03
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
        - name: account
          in: query
          required: false
          schema:
            type: string
        - name: datacenter
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                datacenter:
                  type: string
                options:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Price calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceInfo'

  /internal/monitor/price:
    post:
      summary: Query server price internally (local access)
      operationId: InternalMonitorPrice
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - plan_code
              properties:
                account_id:
                  type: string
                plan_code:
                  type: string
                datacenter:
                  type: string
                options:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Internal price check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Forbidden for non-local IP

  /monitor/interval:
    put:
      summary: Set polling check interval for server stock monitor
      operationId: SetMonitorInterval
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interval:
                  type: integer
                  minimum: 5
                  maximum: 3600
                  example: 30
                check_interval:
                  type: integer
      responses:
        '200':
          description: Interval updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  check_interval:
                    type: integer

  /monitor/start:
    post:
      summary: Start the dedicated server inventory monitor background loop
      operationId: StartMonitor
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Monitor started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /monitor/status:
    get:
      summary: Get status of server monitor
      operationId: GetMonitorStatus
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Monitor status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorStatus'

  /monitor/stop:
    post:
      summary: Stop the server inventory monitor background loop
      operationId: StopMonitor
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Monitor stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  code:
                    type: string

  /monitor/subscriptions:
    get:
      summary: List all active server stock subscriptions
      operationId: GetSubscriptions
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
    post:
      summary: Add a new server stock subscription
      operationId: AddSubscription
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubscriptionRequest'
      responses:
        '200':
          description: Subscription added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  region:
                    type: string
                  subsidiary:
                    type: string
                  regionWarning:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /monitor/subscriptions/{planCode}:
    put:
      summary: Update an existing server stock subscription
      operationId: UpdateSubscription
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubscriptionRequest'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove a server stock subscription
      operationId: RemoveSubscription
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /monitor/subscriptions/{planCode}/history:
    get:
      summary: Get inventory availability history for a subscribed server plan
      operationId: GetSubscriptionHistory
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Availability history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionHistoryEntry'
        '404':
          $ref: '#/components/responses/NotFound'

  /monitor/subscriptions/batch-add-all:
    post:
      summary: Batch subscribe to all catalog server plans
      operationId: BatchAddAllSubscriptions
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notifyAvailable:
                  type: boolean
                notifyUnavailable:
                  type: boolean
                autoOrder:
                  type: boolean
                autoOrderAccountId:
                  type: string
      responses:
        '200':
          description: Batch subscribe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  added:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
                  message:
                    type: string

  /monitor/subscriptions/clear:
    delete:
      summary: Clear all server stock subscriptions
      operationId: ClearSubscriptions
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: All subscriptions cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  message:
                    type: string

  /monitor/test-notification:
    post:
      summary: Broadcast a test notification across configured channels
      operationId: TestNotification
      tags:
        - F05
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Test notification delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  delivered:
                    type: integer
                  message:
                    type: string
        '500':
          description: No channels delivered

  /vps-monitor/models:
    get:
      summary: List orderable VPS models from public catalog
      operationId: GetVPSModels
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subsidiary
          in: query
          required: false
          schema:
            type: string
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of VPS models
          content:
            application/json:
              schema:
                type: object
                properties:
                  subsidiary:
                    type: string
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/VPSModel'

  /vps-monitor/subscriptions:
    get:
      summary: List all active VPS stock subscriptions
      operationId: GetVPSSubscriptions
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of VPS subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VPSSubscription'
    post:
      summary: Add a new VPS stock subscription
      operationId: AddVPSSubscription
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVPSSubscriptionRequest'
      responses:
        '200':
          description: VPS subscription added
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  subscription:
                    $ref: '#/components/schemas/VPSSubscription'
                  retiredWarning:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /vps-monitor/subscriptions/{subscription_id}:
    put:
      summary: Update an existing VPS stock subscription
      operationId: UpdateVPSSubscription
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddVPSSubscriptionRequest'
      responses:
        '200':
          description: VPS subscription updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove a VPS stock subscription
      operationId: RemoveVPSSubscription
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /vps-monitor/subscriptions/{subscription_id}/history:
    get:
      summary: Get inventory availability history for a VPS subscription
      operationId: GetVPSSubscriptionHistory
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VPS availability history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'

  /vps-monitor/subscriptions/batch-add-all:
    post:
      summary: Batch subscribe to all available VPS models
      operationId: BatchAddAllVPSSubscriptions
      tags:
        - F06
      security:
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ovhSubsidiary:
                  type: string
                notifyAvailable:
                  type: boolean
                notifyUnavailable:
                  type: boolean
                autoOrder:
                  type: boolean
                autoOrderAccountId:
                  type: string
                autoPay:
                  type: boolean
      responses:
        '200':
          description: Batch VPS subscribe result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  count:
                    type: integer

  /vps-monitor/subscriptions/clear:
    delete:
      summary: Clear all VPS stock subscriptions
      operationId: ClearVPSSubscriptions
      tags:
