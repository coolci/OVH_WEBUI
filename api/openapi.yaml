components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  responses:
    BadRequest:
      description: Bad request or input validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Business validation or credential failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Credential verification failed"
        status:
          type: integer
          example: 422
        code:
          type: string
          example: "OVH_SIGNATURE_INVALID"
        detail:
          type: string
          example: "Signature rejected by ovh-eu; check Application Secret / Consumer Key activation."
        raw:
          type: string
          nullable: true
          example: "OVHcloud API error (status code 400): Client::BadRequest: \"Invalid signature\""
        ovhQueryId:
          type: string
          nullable: true
          example: "EU.ext-1.abc"
        requestId:
          type: string
          format: uuid
        remediation:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                example: "reissue_consumer_key"
              message:
                type: string
                example: "重新签发 Consumer Key，并点开 OVH 返回的授权链接完成激活"
              url:
                type: string
                format: uri
                nullable: true

    Account:
      type: object
      required:
        - id
        - name
        - subsidiary
        - endpoint
        - iam
        - credentialState
      properties:
        id:
          type: string
          example: "acc_1a2b3c"
        name:
          type: string
          example: "主账号-FR"
        subsidiary:
          type: string
          example: "FR"
        endpoint:
          type: string
          enum: [ovh-eu, ovh-us, ovh-ca]
          example: "ovh-eu"
        iam:
          type: string
          enum: [go-ovh-fr, go-ovh-us, go-ovh-ca]
          example: "go-ovh-fr"
        appKey:
          type: string
          example: "ak_****"
        isDefault:
          type: boolean
          example: true
        credentialState:
          type: string
          enum: [unverified, verified, invalid]
          example: "verified"
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
        verificationReason:
          type: string
          nullable: true

    CreateAccountRequest:
      type: object
      required:
        - name
        - subsidiary
        - appKey
        - appSecret
        - consumerKey
      properties:
        name:
          type: string
        subsidiary:
          type: string
        appKey:
          type: string
        appSecret:
          type: string
        consumerKey:
          type: string

    UpdateAccountRequest:
      type: object
      properties:
        name:
          type: string
        appKey:
          type: string
        appSecret:
          type: string
        consumerKey:
          type: string

    CredentialVerificationResult:
      type: object
      required:
        - valid
        - state
      properties:
        valid:
          type: boolean
        state:
          type: string
          enum: [verified, invalid]
        reason:
          type: string
          nullable: true
        evidence:
          type: object
          properties:
            nichandle:
              type: string
            ovhSubsidiary:
              type: string
            checkedAt:
              type: string
              format: date-time

    Datacenter:
      type: object
      required:
        - datacenter
        - availability
      properties:
        datacenter:
          type: string
          example: "gra"
        availability:
          type: string
          example: "available"

    ServerOption:
      type: object
      required:
        - option
        - value
      properties:
        option:
          type: string
        value:
          type: string
        family:
          type: string
        isDefault:
          type: boolean

    ServerPlan:
      type: object
      required:
        - planCode
        - name
      properties:
        planCode:
          type: string
          example: "24ska01"
        name:
          type: string
          example: "KS-1"
        description:
          type: string
        cpu:
          type: string
        memory:
          type: string
        storage:
          type: string
        bandwidth:
          type: string
        vrackBandwidth:
          type: string
        datacenters:
          type: array
          items:
            $ref: '#/components/schemas/Datacenter'
        defaultOptions:
          type: array
          items:
            $ref: '#/components/schemas/ServerOption'
        availableOptions:
          type: array
          items:
            $ref: '#/components/schemas/ServerOption'

    DatacenterAvailability:
      type: object
      required:
        - datacenter
        - availability
      properties:
        datacenter:
          type: string
          example: "rbx"
        availability:
          type: string
          example: "available"

    QueueItem:
      type: object
      required:
        - id
        - accountId
        - planCode
        - datacenter
        - status
      properties:
        id:
          type: string
        accountId:
          type: string
        planCode:
          type: string
        datacenter:
          type: string
        options:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [running, pending, paused, completed]
        createdAt:
          type: string
        updatedAt:
          type: string
        retryInterval:
          type: integer
        retryCount:
          type: integer
        failureCount:
          type: integer
        maxRetries:
          type: integer
        quickOrder:
          type: boolean
        autoPay:
          type: boolean

    AddQueueItemRequest:
      type: object
      required:
        - planCode
      properties:
        accountId:
          type: string
        planCode:
          type: string
          example: "24ska01"
        datacenter:
          type: string
          example: "gra"
        datacenters:
          type: array
          items:
